<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DMAP - Login</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="app-container center-flex">
        <div class="glass-card" style="width: 100%; max-width: 400px; text-align: left;">
            <div style="text-align: center; margin-bottom: 24px;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <h2>Sign In</h2>
                <p>Welcome to Duke Forest DMAP</p>
            </div>
            
            <form id="authForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required />
                </div>
                
                <p id="message" style="color: var(--error); font-size: 0.9rem; margin-bottom: 16px;"></p>
                
                <button type="submit" id="loginBtn" class="btn btn-primary">Log In</button>
            </form>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
    
    <script src="../js/firebase-init.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
