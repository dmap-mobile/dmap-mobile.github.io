<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DMAP - Loading...</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body>
    <div class="app-container center-flex">
        <div class="glass-card" style="border-radius: 50%; padding: 32px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
        </div>
        <h2 style="margin-top: 24px;">Duke Forest DMAP</h2>
        <p>Loading your session...</p>
    </div>

    <script>
        // Redirect logic for hunters
        var storedHunterId = sessionStorage.getItem("hunterID");
        var loggedIn = Boolean(storedHunterId && /^\d+$/.test(storedHunterId) && storedHunterId !== "0");
        
        if (loggedIn) {
            window.location.href = 'pages/reserve.html';
        } else {
            window.location.href = 'pages/hunter-login.html';
        }
    </script>
</body>
</html>
