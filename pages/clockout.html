<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#173f35">
    <title>DMAP — Clocked Out</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <main class="app-container center-flex">
        <section class="clockout-card glass-card" aria-labelledby="clockoutTitle">
            <div class="success-mark" aria-hidden="true">✓</div>
            <h1 id="clockoutTitle">You are all checked out</h1>
            <p id="clockoutPerson">Your catch was recorded successfully.</p>
            <p>You are all set in the Duke Forest DMAP system.</p>
            <button id="backToLogin" class="btn btn-primary" type="button">Return to login</button>
            <p class="contact-note">
                If anything was incorrect or was entered by mistake, contact the Duke Forest administrator as soon as possible.
            </p>
        </section>
    </main>
    <script src="../js/clockout.js"></script>
</body>
</html>
