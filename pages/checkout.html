<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#173f35">
    <title>DMAP — Log Deer</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/auth-guard.js"></script>
</head>
<body>
    <main class="app-container">
        <header class="page-header">
            <div>
                <h1>Log Deer</h1>
                <p>Record today’s catch, then clock out.</p>
            </div>
        </header>

        <section aria-label="Today’s harvest counts">
            <div class="counter-group">
                <span class="counter-label">Adult bucks</span>
                <div class="stepper" aria-label="Adult bucks count">
                    <button class="stepper-btn" id="bucksMinus" type="button" aria-label="Subtract adult buck">−</button>
                    <span class="stepper-value" id="bucksVal" aria-live="polite">0</span>
                    <button class="stepper-btn" id="bucksPlus" type="button" aria-label="Add adult buck">+</button>
                    <input type="hidden" id="bucks" value="0">
                </div>
            </div>

            <div class="counter-group">
                <span class="counter-label">Button bucks</span>
                <div class="stepper" aria-label="Button bucks count">
                    <button class="stepper-btn" id="buttonsMinus" type="button" aria-label="Subtract button buck">−</button>
                    <span class="stepper-value" id="buttonsVal" aria-live="polite">0</span>
                    <button class="stepper-btn" id="buttonsPlus" type="button" aria-label="Add button buck">+</button>
                    <input type="hidden" id="buttons" value="0">
                </div>
            </div>

            <div class="counter-group">
                <span class="counter-label">Does</span>
                <div class="stepper" aria-label="Does count">
                    <button class="stepper-btn" id="doesMinus" type="button" aria-label="Subtract doe">−</button>
                    <span class="stepper-value" id="doesVal" aria-live="polite">0</span>
                    <button class="stepper-btn" id="doesPlus" type="button" aria-label="Add doe">+</button>
                    <input type="hidden" id="does" value="0">
                </div>
            </div>
        </section>

        <p id="checkoutStatus" class="inline-status" role="status" aria-live="polite">Checking today’s reservation…</p>
        <button id="submit" class="btn btn-primary" type="button" disabled>Submit catch &amp; clock out</button>
    </main>

    <nav class="bottom-nav" aria-label="Hunter navigation">
        <a href="reserve.html" class="nav-item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
            <span>Reserve</span>
        </a>
        <a href="checkout.html" class="nav-item active" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <span>Log Deer</span>
        </a>
        <a href="#" id="logout" class="nav-item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            <span>Logout</span>
        </a>
    </nav>

    <dialog id="logoutDialog" class="app-dialog" aria-labelledby="logoutDialogTitle">
        <div class="dialog-content">
            <button class="dialog-close" type="button" data-close-dialog="logoutDialog" aria-label="Close logout dialog">×</button>
            <h2 id="logoutDialogTitle">Log out without recording today’s catch?</h2>
            <p>Your deer counts will not be saved if you leave this page without submitting.</p>
            <div class="dialog-actions">
                <button id="confirmLogout" class="btn btn-danger" type="button">Log out</button>
                <button class="btn btn-secondary" type="button" data-close-dialog="logoutDialog">Go back</button>
            </div>
        </div>
    </dialog>

    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-init.js"></script>
    <script src="../reservationData.js"></script>
    <script src="../js/checkout.js"></script>
</body>
</html>
