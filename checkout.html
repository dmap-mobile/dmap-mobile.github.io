<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#173f35">
    <title>DMAP - Log Deer</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/auth-guard.js"></script>
    <style>
        .counter-group {
            background: var(--surface-solid);
            padding: 24px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .counter-label {
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="app-container" style="padding-bottom: 90px;">
        <header style="margin-bottom: 24px;">
            <h1 id="pageTitle">Log Deer & Clock Out</h1>
            <p style="font-size: 0.9rem;">Record today's catch for season totals</p>
        </header>

        <div class="counter-group">
            <span class="counter-label">Adult Bucks</span>
            <div class="stepper">
                <button class="stepper-btn" id="bucksMinus">−</button>
                <span class="stepper-value" id="bucksVal">0</span>
                <button class="stepper-btn" id="bucksPlus">+</button>
                <input type="hidden" id="bucks" value="0">
            </div>
        </div>

        <div class="counter-group">
            <span class="counter-label">Button Bucks</span>
            <div class="stepper">
                <button class="stepper-btn" id="buttonsMinus">−</button>
                <span class="stepper-value" id="buttonsVal">0</span>
                <button class="stepper-btn" id="buttonsPlus">+</button>
                <input type="hidden" id="buttons" value="0">
            </div>
        </div>

        <div class="counter-group">
            <span class="counter-label">Does</span>
            <div class="stepper">
                <button class="stepper-btn" id="doesMinus">−</button>
                <span class="stepper-value" id="doesVal">0</span>
                <button class="stepper-btn" id="doesPlus">+</button>
                <input type="hidden" id="does" value="0">
            </div>
        </div>

        <button id="submit" class="btn btn-primary" style="margin-top: 16px;">Submit & Clock Out</button>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="reserve.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
            <span>Reserve</span>
        </a>
        <a href="checkout.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <span>Log Deer</span>
        </a>
        <a href="#" id="logout" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            <span>Logout</span>
        </a>
    </nav>

    <div id="logoutDialog" class="dialog">
        <div class="dialog-content">
            <h2>Finish this session?</h2>
            <div style="display: flex; gap: 8px; margin-top: 24px;">
                <button id="confirmLogout" class="btn btn-primary">Yes, log out</button>
                <button class="btn btn-secondary" onclick="document.getElementById('logoutDialog').removeAttribute('open')">Go back</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
    
    <script src="../js/firebase-init.js"></script>
    <script src="../js/checkout.js"></script>
    <script>
        document.getElementById("logout").addEventListener("click", (e) => {
            e.preventDefault();
            document.getElementById("logoutDialog").setAttribute("open", "");
        });
        document.getElementById("confirmLogout").addEventListener("click", () => {
            sessionStorage.removeItem("hunterID");
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
